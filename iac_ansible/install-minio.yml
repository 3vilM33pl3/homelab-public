---
- name: Install MinIO on edge hosts for OpenTofu state
  hosts: edge_hosts
  become: yes
  vars_prompt:
    - name: minio_root_user
      prompt: "MinIO root user"
      private: no
      default: "minioadmin"
    - name: minio_root_password
      prompt: "MinIO root password"
      private: yes
      default: ""
    - name: minio_tf_access_key
      prompt: "OpenTofu state access key (leave blank to skip user creation)"
      private: no
      default: ""
    - name: minio_tf_secret_key
      prompt: "OpenTofu state secret key (leave blank to skip user creation)"
      private: yes
      default: ""
  handlers:
    - name: restart minio
      ansible.builtin.systemd:
        name: minio
        state: restarted
        enabled: true
        daemon_reload: true
  pre_tasks:
    - name: Assert MinIO bootstrap prerequisites
      ansible.builtin.assert:
        that:
          - ansible_os_family in supported_os_families
          - ansible_mounts | selectattr("mount", "equalto", minio_required_mount) | list | length > 0
        fail_msg: "The required MinIO mount is missing from ansible_mounts."

    - name: Capture MinIO mount facts
      ansible.builtin.set_fact:
        minio_mount_fact: "{{ (ansible_mounts | selectattr('mount', 'equalto', minio_required_mount) | list)[0] }}"

    - name: Assert minimum free space for object storage
      ansible.builtin.assert:
        that:
          - (minio_mount_fact.size_available / 1024 / 1024) | int >= minio_required_free_mb
        fail_msg: "The required MinIO mount does not have enough free space."
  tasks:
    - import_tasks: tasks/minio.yml
      tags: [storage, minio]
