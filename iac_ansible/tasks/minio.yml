---
- name: Ensure MinIO parent directory exists
  ansible.builtin.file:
    path: "{{ minio_required_mount }}"
    state: directory
    mode: "0755"

- name: Ensure MinIO data directory exists
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    mode: "0750"

- name: Render MinIO environment file
  ansible.builtin.template:
    src: templates/minio.env.j2
    dest: /etc/default/minio
    mode: "0600"
  notify: restart minio

- name: Render MinIO systemd unit
  ansible.builtin.template:
    src: templates/minio.service.j2
    dest: /etc/systemd/system/minio.service
    mode: "0644"
  notify: restart minio

- name: Flush MinIO handler
  ansible.builtin.meta: flush_handlers

- name: Validate MinIO health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ minio_api_port }}/minio/health/live"
    status_code: 200
  register: minio_health
  retries: 5
  delay: 2
  until: minio_health.status == 200
