---
- name: Install common base packages
  ansible.builtin.package:
    name:
      - curl
      - vim
      - htop
      - jq
      - ca-certificates
    state: present

- name: Ensure system trust store directory exists
  ansible.builtin.file:
    path: "{{ trusted_ca_root_path | dirname }}"
    state: directory
    mode: "0755"

- name: Install internal CA root certificate placeholder
  ansible.builtin.copy:
    content: "{{ trusted_ca_placeholder_pem }}"
    dest: "{{ trusted_ca_root_path }}"
    mode: "0644"
  notify: refresh ca trust

- name: Verify trust root placeholder is present
  ansible.builtin.stat:
    path: "{{ trusted_ca_root_path }}"
  register: trust_root_file

- name: Assert trust root placeholder exists
  ansible.builtin.assert:
    that:
      - trust_root_file.stat.exists
      - trust_root_file.stat.size > 0
    fail_msg: "The trust root placeholder was not rendered."
